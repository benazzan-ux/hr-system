<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام التوظيف | Recruitment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f6f3;--surface:#fff;--ink:#17252a;--mute:#5d6b6f;--line:#dfe3df;--accent:#1f5f5b;--on:#fff;
--applied:#6b7a8f;--screening:#3b6ea8;--interview:#7a5ab0;--offer:#b7791f;--hired:#2e8b57;--rejected:#a8433a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101719;--surface:#182224;--ink:#e6eceb;--mute:#93a3a5;--line:#2a3739;--accent:#6fc2b8;--on:#0c1415;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101719;--surface:#182224;--ink:#e6eceb;--mute:#93a3a5;--line:#2a3739;--accent:#6fc2b8;--on:#0c1415;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;font-weight:600}
nav{display:flex;gap:4px;flex:1}
button,select,input,textarea{font:inherit;color:inherit}
.tab{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--mute)}
.tab[aria-selected=true]{background:var(--accent);color:var(--on)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--on);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:20px;max-width:1400px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.sp{flex:1}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.bar select{width:auto;min-width:200px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 230px;background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:10px;padding:10px;min-height:300px}
.col.over{outline:2px dashed var(--accent)}
.col h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;border-inline-start:4px solid var(--c);padding-inline-start:8px}
.col h3 span{color:var(--mute);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer}
.card[draggable=true]{cursor:grab}
.card b{display:block;font-weight:500}
.card small{color:var(--mute);display:block}
.star{color:var(--offer);letter-spacing:2px}
.empty{color:var(--mute);font-size:13px;padding:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{font-size:26px;display:block;line-height:1.2}
.stat span{color:var(--mute)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 12px}
.fun{display:grid;grid-template-columns:110px 1fr 30px;gap:10px;align-items:center;margin-bottom:8px}
.fun i{display:block;height:14px;border-radius:7px;background:var(--c)}
.list{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list th,.list td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--line)}
.list th{font-weight:500;color:var(--mute)}
.wrap{overflow-x:auto}
.login{max-width:380px;margin:8vh auto}
.hello{font-size:26px;margin:0 0 4px;font-weight:600}
.sub{margin:0 0 18px;color:var(--mute)}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:8px;cursor:pointer;color:var(--mute)}
.seg button[aria-selected=true]{background:var(--accent);color:var(--on)}
.wide{width:100%;padding:10px}
input:-webkit-autofill{-webkit-text-fill-color:var(--ink);box-shadow:0 0 0 100px var(--surface) inset}
.err{border-color:var(--rejected);color:var(--rejected)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(460px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;margin-bottom:12px;color:var(--mute);font-size:13px}
label>*{margin-top:4px;color:var(--ink);font-size:15px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,addDoc,setDoc,updateDoc,writeBatch,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCjpHMArz4z8a9v6klmAHCKxhlCX10wc9s",
  authDomain:"recuitment-system-2b275.firebaseapp.com",
  projectId:"recuitment-system-2b275",
  storageBucket:"recuitment-system-2b275.firebasestorage.app",
  messagingSenderId:"977865460132",
  appId:"1:977865460132:web:46511c1a9e8880a4d89931"
});
const auth=getAuth(app),db=getFirestore(app);

const ST=['applied','screening','interview','offer','hired','rejected'];
const L={
ar:{app:'نظام التوظيف',dash:'لوحة المتابعة',pipe:'مسار المرشحين',jobs:'الوظائف',applied:'تقديم الطلب',screening:'الفرز',interview:'المقابلة',offer:'العرض',hired:'تم التعيين',rejected:'مرفوض',all:'كل الوظائف',addC:'إضافة مرشح',addJ:'إضافة وظيفة',name:'الاسم',job:'الوظيفة',stage:'المرحلة',rating:'التقييم',notes:'ملاحظات الفريق',save:'حفظ',close:'إغلاق',cands:'المرشحون',open:'مفتوحة',closed:'مغلقة',total:'إجمالي المرشحين',openJobs:'وظائف مفتوحة',inProc:'قيد الإجراء',hiredN:'تم تعيينهم',empty:'لا يوجد مرشحون هنا',lang:'English',title:'المسمى الوظيفي',dept:'القسم',status:'الحالة',toggle:'فتح / إغلاق',funnel:'توزيع المرشحين حسب المرحلة',email:'البريد الإلكتروني',pass:'كلمة المرور',in:'تسجيل الدخول',out:'تسجيل الخروج',bad:'تعذر تسجيل الدخول. تأكد من البريد وكلمة المرور.',noAccess:'حسابك غير مفعّل في النظام. اطلب من مدير النظام إضافتك.',loading:'جارٍ التحميل...',admin:'مدير النظام',recruiter:'مسؤول توظيف',manager:'مدير معني',pending:'بانتظار الموافقة',waitMsg:'تم إنشاء حسابك وهو بانتظار موافقة مدير النظام.',team:'الفريق',roleL:'الدور',up:'إنشاء حساب جديد',create:'إنشاء الحساب',noProv:'طريقة الدخول بالبريد غير مفعّلة في Firebase (Authentication ثم Sign-in method).',firstHint:'أول حساب يُنشأ في النظام يصبح مدير النظام.',gm:'صباح الخير',ga:'مساء الخير',ge:'مساء الخير',welcome:'مرحبًا بك في نظام التوظيف. سجّل دخولك للمتابعة.',exists:'هذا البريد مسجّل مسبقًا.',weak:'كلمة المرور قصيرة، استخدم 6 أحرف على الأقل.',fail:'تعذر الحفظ. ليست لديك صلاحية أو انقطع الاتصال.'},
en:{app:'Recruitment',dash:'Dashboard',pipe:'Pipeline',jobs:'Jobs',applied:'Applied',screening:'Screening',interview:'Interview',offer:'Offer',hired:'Hired',rejected:'Rejected',all:'All jobs',addC:'Add candidate',addJ:'Add job',name:'Name',job:'Job',stage:'Stage',rating:'Rating',notes:'Team notes',save:'Save',close:'Close',cands:'Candidates',open:'Open',closed:'Closed',total:'Total candidates',openJobs:'Open jobs',inProc:'In process',hiredN:'Hired',empty:'No candidates here',lang:'العربية',title:'Job title',dept:'Department',status:'Status',toggle:'Open / close',funnel:'Candidates by stage',email:'Email',pass:'Password',in:'Sign in',out:'Sign out',bad:'Sign-in failed. Check your email and password.',noAccess:'Your account is not set up yet. Ask an admin to add you.',loading:'Loading...',admin:'Admin',recruiter:'Recruiter',manager:'Hiring manager',pending:'Pending approval',waitMsg:'Your account was created and is waiting for admin approval.',team:'Team',roleL:'Role',up:'Create account',create:'Create account',noProv:'Email sign-in is not enabled in Firebase (Authentication, Sign-in method).',firstHint:'The first account created becomes the system admin.',gm:'Good morning',ga:'Good afternoon',ge:'Good evening',welcome:'Welcome to the recruitment system. Sign in to continue.',exists:'This email is already registered.',weak:'Password is too short. Use at least 6 characters.',fail:'Could not save. You may lack permission or the connection dropped.'}};

let D={lang:'ar',tab:'pipe',jf:'all',jobs:[],cands:[],user:null,role:null,ready:false,msg:'',mode:'in',users:[],signing:false};
try{const l=localStorage.getItem('hr-lang');if(l)D.lang=l}catch(x){}
let unsubs=[];
const t=k=>L[D.lang][k]||k;
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const job=id=>D.jobs.find(j=>j.id==id);
const jt=id=>{const j=job(id);return j?j.t[D.lang]:''};
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function greet(){const h=new Date().getHours();return t(h>=5&&h<12?'gm':h>=12&&h<18?'ga':'ge')}
const canEdit=()=>D.role=='admin'||D.role=='recruiter';
const fail=()=>{D.msg=t('fail');render()};

const STAFF=['admin','recruiter','manager'];
async function claim(u){
 const ref=doc(db,'users',u.uid),base={email:u.email,createdAt:serverTimestamp()};
 try{const b=writeBatch(db);b.set(doc(db,'settings','init'),{by:u.uid,at:serverTimestamp()});b.set(ref,{...base,role:'admin'});await b.commit();return 'admin'}
 catch(x){try{await setDoc(ref,{...base,role:'pending'});return 'pending'}catch(y){D.msg='['+(y.code||y.message)+']';return 'none'}}
}
async function enter(u){
 unsubs.forEach(f=>f());unsubs=[];
 D.user=u;D.role=null;D.jobs=[];D.cands=[];D.users=[];D.msg='';
 if(u){
  try{const s=await getDoc(doc(db,'users',u.uid));D.role=s.exists()?s.data().role:await claim(u)}catch(x){D.role='none';D.msg='['+(x.code||x.message)+']'}
  if(STAFF.includes(D.role)){
   if(D.role=='admin')unsubs.push(onSnapshot(collection(db,'users'),s=>{D.users=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
   const onErr=er=>{D.msg=er.message;render()};
   unsubs.push(onSnapshot(query(collection(db,'jobs'),orderBy('createdAt')),s=>{D.jobs=s.docs.map(d=>({id:d.id,...d.data()}));render()},onErr));
   unsubs.push(onSnapshot(query(collection(db,'candidates'),orderBy('createdAt')),s=>{D.cands=s.docs.map(d=>({id:d.id,...d.data()}));render()},onErr));
  }
 }
 D.ready=true;render();
}
onAuthStateChanged(auth,u=>{if(!D.signing)enter(u)});

function hdr(nav){
 const tabs=nav?(D.role=='admin'?['dash','pipe','jobs','team']:['dash','pipe','jobs']).map(k=>`<button class="tab" role="tab" aria-selected="${D.tab==k}" data-act="tab" data-v="${k}">${t(k)}</button>`).join(''):'';
 const who=nav?`<span>${t(D.role)}</span><button class="btn" data-act="out">${t('out')}</button>`:'';
 return `<header><h1>${t('app')}</h1><nav role="tablist">${tabs}</nav>${who}<button class="btn" data-act="lang">${t('lang')}</button></header>`;
}
function render(){
 const h=document.documentElement;h.lang=D.lang;h.dir=D.lang=='ar'?'rtl':'ltr';
 let out;
 if(!D.ready)out=`${hdr(false)}<main>${t('loading')}</main>`;
 else if(!D.user)out=`${hdr(false)}<main><form class="panel login" id="lf"><h2 class="hello">${greet()}</h2><p class="sub">${t('welcome')}</p><div class="seg" role="tablist"><button type="button" role="tab" aria-selected="${D.mode!='up'}" data-act="mode" data-v="in">${t('in')}</button><button type="button" role="tab" aria-selected="${D.mode=='up'}" data-act="mode" data-v="up">${t('up')}</button></div>${D.mode=='up'?`<p class="sub">${t('firstHint')}</p>`:''}<label>${t('email')}<input id="em" type="email" autocomplete="username" required></label><label>${t('pass')}<input id="pw" type="password" autocomplete="current-password" required></label>${D.msg?`<p class="err" role="alert">${e(D.msg)}</p>`:''}<button class="btn pri wide" type="submit">${D.mode=='up'?t('create'):t('in')}</button></form></main>`;
 else if(!STAFF.includes(D.role))out=`${hdr(true)}<main><div class="panel"><p>${D.role=='pending'?t('waitMsg'):t('noAccess')}</p>${D.msg?`<p class="err">${e(D.msg)}</p>`:''}</div></main>`;
 else out=`${hdr(true)}<main>${D.msg?`<div class="panel err" role="alert">${e(D.msg)}</div>`:''}${D.tab=='dash'?dash():D.tab=='jobs'?jobsV():D.tab=='team'&&D.role=='admin'?teamV():pipe()}</main>`;
 $('app').innerHTML=out;
}
function pipe(){
 const list=D.cands.filter(c=>D.jf=='all'||c.job==D.jf),ed=canEdit();
 const opts=`<option value="all">${t('all')}</option>`+D.jobs.map(j=>`<option value="${j.id}" ${D.jf==j.id?'selected':''}>${e(j.t[D.lang])}</option>`).join('');
 const cols=ST.map(s=>{const cs=list.filter(c=>c.stage==s);
  return `<section class="col" data-s="${s}" style="--c:var(--${s})"><h3>${t(s)}<span>${cs.length}</span></h3>`+
  (cs.map(c=>`<div class="card" ${ed?'draggable="true"':''} tabindex="0" data-act="edit" data-id="${c.id}"><b>${e(c.name)}</b><small>${e(jt(c.job))}</small><span class="star">${stars(c.rating||0)}</span></div>`).join('')||`<div class="empty">${t('empty')}</div>`)+`</section>`}).join('');
 return `<div class="bar"><select id="jf" aria-label="${t('job')}">${opts}</select><span class="sp"></span>${ed&&D.jobs.length?`<button class="btn pri" data-act="newC">${t('addC')}</button>`:''}</div><div class="board">${cols}</div>`;
}
function dash(){
 const c=D.cands,n=s=>c.filter(x=>x.stage==s).length,max=Math.max(1,...ST.map(n));
 const proc=c.filter(x=>x.stage!='hired'&&x.stage!='rejected').length;
 const stat=(v,l)=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`;
 const fun=ST.map(s=>`<div class="fun" style="--c:var(--${s})"><span>${t(s)}</span><i style="width:${Math.max(3,n(s)/max*100)}%"></i><b>${n(s)}</b></div>`).join('');
 return `<div class="stats">${stat(c.length,t('total'))}${stat(D.jobs.filter(j=>j.open).length,t('openJobs'))}${stat(proc,t('inProc'))}${stat(n('hired'),t('hiredN'))}</div><div class="panel"><h2>${t('funnel')}</h2>${fun}</div>`;
}
function jobsV(){
 const ed=canEdit();
 const rows=D.jobs.map(j=>`<tr><td>${e(j.t[D.lang])}</td><td>${e(j.d[D.lang])}</td><td>${D.cands.filter(c=>c.job==j.id).length}</td><td>${j.open?t('open'):t('closed')}</td><td>${ed?`<button class="btn" data-act="tgl" data-id="${j.id}">${t('toggle')}</button>`:''}</td></tr>`).join('');
 return `<div class="bar"><span class="sp"></span>${ed?`<button class="btn pri" data-act="newJ">${t('addJ')}</button>`:''}</div><div class="wrap"><table class="list"><tr><th>${t('title')}</th><th>${t('dept')}</th><th>${t('cands')}</th><th>${t('status')}</th><th></th></tr>${rows}</table></div>`;
}
function teamV(){
 const ro=['pending','manager','recruiter','admin'];
 const rows=D.users.map(u=>`<tr><td>${e(u.email||u.id)}</td><td><select data-uid="${u.id}" ${u.id==D.user.uid?'disabled':''}>${ro.map(r=>`<option value="${r}" ${u.role==r?'selected':''}>${t(r)}</option>`).join('')}</select></td></tr>`).join('');
 return `<div class="wrap"><table class="list"><tr><th>${t('email')}</th><th>${t('roleL')}</th></tr>${rows}</table></div>`;
}
function candDlg(id){
 const c=id?D.cands.find(x=>x.id==id):{id:'',name:'',job:D.jobs[0].id,stage:'applied',rating:0,notes:''};
 const ed=canEdit()?'':'disabled';
 const jo=D.jobs.map(j=>`<option value="${j.id}" ${c.job==j.id?'selected':''}>${e(j.t[D.lang])}</option>`).join('');
 const so=ST.map(s=>`<option value="${s}" ${c.stage==s?'selected':''}>${t(s)}</option>`).join('');
 const ro=[0,1,2,3,4,5].map(r=>`<option value="${r}" ${(c.rating||0)==r?'selected':''}>${r?'★'.repeat(r):'-'}</option>`).join('');
 $('dlg').innerHTML=`<label>${t('name')}<input id="fn" value="${e(c.name)}" ${ed}></label><label>${t('job')}<select id="fj" ${ed}>${jo}</select></label><label>${t('stage')}<select id="fs" ${ed}>${so}</select></label><label>${t('rating')}<select id="fr">${ro}</select></label><label>${t('notes')}<textarea id="fnote" rows="3">${e(c.notes)}</textarea></label><div class="acts"><button class="btn" data-act="x">${t('close')}</button><button class="btn pri" data-act="saveC" data-id="${c.id}">${t('save')}</button></div>`;
 $('dlg').showModal();
}
function jobDlg(){
 $('dlg').innerHTML=`<label>${t('title')}<input id="jt"></label><label>${t('dept')}<input id="jd"></label><div class="acts"><button class="btn" data-act="x">${t('close')}</button><button class="btn pri" data-act="saveJ">${t('save')}</button></div>`;
 $('dlg').showModal();
}

document.addEventListener('submit',async ev=>{
 if(ev.target.id!='lf')return;ev.preventDefault();
 const em=$('em').value.trim(),pw=$('pw').value;
 if(D.mode!='up'){try{await signInWithEmailAndPassword(auth,em,pw)}catch(x){D.msg=t('bad')+' ['+(x.code||x.message)+']';render()}return}
 D.signing=true;
 try{
  const c=await createUserWithEmailAndPassword(auth,em,pw);
  D.signing=false;await enter(c.user);
 }catch(x){D.signing=false;D.msg=(x.code=='auth/email-already-in-use'?t('exists'):x.code=='auth/weak-password'?t('weak'):x.code=='auth/operation-not-allowed'?t('noProv'):t('bad'))+' ['+(x.code||x.message)+']';render()}
});
document.addEventListener('click',async ev=>{
 const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 try{
  if(a=='tab'){D.tab=b.dataset.v}
  else if(a=='lang'){D.lang=D.lang=='ar'?'en':'ar';try{localStorage.setItem('hr-lang',D.lang)}catch(x){}}
  else if(a=='mode'){D.mode=b.dataset.v}
  else if(a=='out'){await signOut(auth);return}
  else if(a=='edit'){return candDlg(id)}
  else if(a=='newC'){return candDlg('')}
  else if(a=='newJ'){return jobDlg()}
  else if(a=='x'){return $('dlg').close()}
  else if(a=='tgl'){await updateDoc(doc(db,'jobs',id),{open:!job(id).open});return}
  else if(a=='saveC'){
   const nm=$('fn').value.trim();if(!nm){$('fn').focus();return}
   const r=+$('fr').value,no=$('fnote').value;
   if(!canEdit()){await updateDoc(doc(db,'candidates',id),{rating:r,notes:no})}
   else{const o={name:nm,job:$('fj').value,stage:$('fs').value,rating:r,notes:no};
    if(id)await updateDoc(doc(db,'candidates',id),o);else await addDoc(collection(db,'candidates'),{...o,createdAt:serverTimestamp()})}
   $('dlg').close();return}
  else if(a=='saveJ'){
   const v=$('jt').value.trim();if(!v){$('jt').focus();return}
   const d=$('jd').value.trim()||'-';
   await addDoc(collection(db,'jobs'),{t:{ar:v,en:v},d:{ar:d,en:d},open:true,createdAt:serverTimestamp()});
   $('dlg').close();return}
  D.msg='';render();
 }catch(x){fail()}
});
document.addEventListener('change',ev=>{const u=ev.target.dataset.uid;if(u){updateDoc(doc(db,'users',u),{role:ev.target.value}).catch(fail);return}if(ev.target.id=='jf'){D.jf=ev.target.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.classList.contains('card'))candDlg(ev.target.dataset.id)});
let drag=null;
document.addEventListener('dragstart',ev=>{const c=ev.target.closest('.card');if(c){drag=c.dataset.id;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',drag)}});
document.addEventListener('dragover',ev=>{const c=ev.target.closest('.col');if(c&&drag){ev.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',ev=>{const c=ev.target.closest('.col');if(c)c.classList.remove('over')});
document.addEventListener('drop',async ev=>{
 const c=ev.target.closest('.col');if(!c||!drag)return;ev.preventDefault();
 const id=drag;drag=null;
 try{await updateDoc(doc(db,'candidates',id),{stage:c.dataset.s})}catch(x){fail()}
 render();
});
render();
</script>
